# Database cho máy phát triển và cho bộ kiểm, cùng trang Swagger UI đọc hợp đồng API —
# CHỈ cho máy phát triển, không phải cấu hình chạy thật. Quy ước:
# docs/product/2-db/10-quy-uoc-code.md (QC-01…QC-03, QC-05, QC-08). Mật khẩu ở đây là
# mật khẩu máy phát triển, không dùng ở đâu khác.
#
#   docker compose up -d --wait db              # database để làm việc
#   docker compose run --rm migrate             # chạy mọi migration ở db/migrations/
#   docker compose up -d swagger                # Swagger UI — http://127.0.0.1:8081/docs/
#   ./scripts/db-check.sh                       # bộ kiểm — dựng một database RIÊNG, rỗng
name: banhcuon

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: banhcuon
      POSTGRES_USER: shop_owner
      POSTGRES_PASSWORD: shop_owner_dev
      # QC-02: UTF8 + cách so mặc định "C" (so từng byte). Văn bản cho người đọc
      # khai cách so tiếng Việt tường minh ở từng cột (QD-60).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop_owner", "-d", "banhcuon"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    # QC-05: lược đồ vào schema `shop`; bảng ghi phiên bản của công cụ nằm ở
    # `public`, ngoài tầm các phép kiểm QD-XX. Đường dẫn và database nằm ở
    # entrypoint, nên lệnh con đổi được mà không chép lại chúng (P2-09):
    #   docker compose run --rm migrate             # up — mọi bước chưa chạy
    #   docker compose run --rm migrate down 1      # lùi một bước
    #   docker compose run --rm migrate version     # đang ở bước nào, dirty hay không
    #   docker compose run --rm migrate force <số>  # gỡ dấu dirty sau một lệnh hỏng
    # Khi nào dùng lệnh nào: docs/product/2-db/07-thu-tu-migration.md.
    entrypoint:
      - migrate
      - -path=/migrations
      - -database
      - postgres://shop_owner:shop_owner_dev@db:5432/banhcuon?sslmode=disable&search_path=shop&x-migrations-table=%22public%22.%22schema_migrations%22&x-migrations-table-quoted=1
    command: ["up"]

  swagger:
    image: swaggerapi/swagger-ui:v5.32.5
    profiles: ["tools"]
    # Chỉ ĐỌC hợp đồng docs/product/3-be/openapi.yaml (owner: CLAUDE.md §2); sửa file
    # rồi tải lại trang là thấy, không cần dựng lại. Nút "Try it out" đi qua nginx của
    # service này tới server Go trên máy (BE_UPSTREAM, mặc định cổng 8080 của máy) —
    # cấu hình: tools/swagger/default.conf.template. Cửa có quyền cần cookie đăng nhập;
    # server đặt BANHCUON_ORIGIN theo nguồn giao diện. Cookie Secure cần HTTPS.
    environment:
      SWAGGER_JSON: /contract/openapi.yaml
      BASE_URL: /docs
      BE_UPSTREAM: ${BE_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    volumes:
      - ./docs/product/3-be/openapi.yaml:/contract/openapi.yaml:ro
      - ./tools/swagger/default.conf.template:/etc/nginx/templates/default.conf.template:ro
