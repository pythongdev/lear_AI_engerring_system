# Hợp đồng API — Bánh cuốn Bà Thanh Cao Bằng. Owner: hàng *Hợp đồng API* ở CLAUDE.md §2.
# Khuôn, luật đọc và luật đổi file này: docs/product/3-be/01-hop-dong-api.md (P3-04, ADR-084).
# Hợp đồng thắng code; migration thắng hợp đồng về tên ràng buộc (ADR-053 luật 2).
# Gate 1g (scripts/check-api-contract.sh) đọc file này theo khuôn §2 của tài liệu trên:
# thụt hai dấu cách, mỗi khoá một dòng, không dùng neo hay khối gộp của YAML.
openapi: 3.1.0
info:
  title: Bánh cuốn Bà Thanh — API
  version: 0.30.0
  description: >-
    Nguồn duy nhất cho FE (pha 4 sinh type từ file này). Rỗng đường gọi ở P3-04;
    mỗi lát P3-05…P3-12 thêm đường gọi của mình cùng lượt dựng cửa.
# Mỗi lát thêm đường gọi của mình; khuôn bắt đầu rỗng (P3-04, Bẫy: không chép prompt-fullstack §3.6).
# Lớp quyền của mỗi cửa ghi: 02-vai-va-quyen.md (P3-05, ADR-085).
security:
  - PersonIdentity: []
# Nhóm trong Swagger UI = gói miền dưới be/internal/ đăng ký đường gọi ấy (chỉ để đọc, không phải luật).
tags:
  - name: combo
    description: Combo có giá riêng do chủ quán quản lý (I-032, ADR-116).
  - name: danhmuc
    description: Danh mục món do chủ quán quản lý (P3A-05).
  - name: daotao
    description: Hướng dẫn công việc và ghi nhận đào tạo (P3A-04).
  - name: giaoviec
    description: Giao việc và đánh dấu bằng sự kiện; chủ quán hoặc người đứng quầy (P3A-03).
  - name: nguyenlieu
    description: Sổ nguyên liệu do chủ quán ghi — tổng và hiệu số từ các con số ngày (P3A-02).
  - name: khoanchi
    description: Khoản chi và loại chi — chỉ chủ quán ghi, sửa có lý do và đọc (P3A-01).
  - name: nguoi
    description: Người và ca quầy — danh sách người để chọn tên, vào và rời ca quầy.
  - name: menu
    description: Sửa menu — đổi giá thành phần, phụ thu, thành phần của món, ngừng bán.
  - name: gia
    description: Đọc menu và tính thử giá — hàm giá duy nhất (03-ham-gia.md).
  - name: ban
    description: Bàn — trạng thái các bàn, đánh dấu đã dọn (04-luong-tai-ban.md).
  - name: qr
    description: Mã QR của bàn — khách đọc bàn từ mã, chủ quán đổi mã.
  - name: phien
    description: Phiên bàn — khách gọi tính tiền (04-luong-tai-ban.md).
  - name: don
    description: Tạo và đổi trạng thái đơn — tại quầy, QR, online, điện thoại, đặt trước; duyệt, từ chối, huỷ, rời quán (04 · 05).
  - name: nhandon
    description: Nhận đơn ở quầy — hàng chờ, tạm dừng nhận đơn, báo mù và mở lại, tín hiệu realtime (09-realtime-du-phong.md).
  - name: sanxuat
    description: Sản xuất theo mẻ — bấm mẻ, lùi mẻ, ra bàn, chuyển việc trạm, ghi làm sai, bảng trạm (07-san-xuat-theo-me.md).
  - name: tratruoc
    description: Trả trước — nhận tiền trả trước của đơn (06-duong-tien.md).
  - name: hoadon
    description: Hoá đơn — trao, giao xong, đóng phiên, hoàn tiền, thu nợ, trả lại trả trước, nhập bù từ sổ giấy (06 · 08-vet-va-nhap-bu.md).
  - name: ket
    description: Két và ngày bán — tiền đầu ngày, đếm két, khai sổ giấy, ký đối chiếu ngày (06-duong-tien.md).
paths:
  /menu-combos:
    get:
      operationId: listMenuCombos
      tags: [combo]
      summary: Đọc combo của chủ quán.
      description: Lớp chu_quan, kể cả đọc. include_hidden vắng hoặc false thì bỏ combo ẩn, true thì kèm, giá trị khác trả 400 field=include_hidden trước quyền và database. Combo theo name (collation của cột) rồi id; items theo menu_combo_item.id, giữ thứ tự gửi khi lập. Món ngừng bán vẫn đọc được, không mang giá.
      parameters:
        - name: include_hidden
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuComboList'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createMenuCombo
      tags: [combo]
      summary: Lập combo với một giá riêng.
      description: Lớp chu_quan. Kiểm hình trước quyền và database theo thứ tự name, price_vnd, items, rồi từng phần tử. name cắt khoảng trắng, thiếu hoặc rỗng trả 400 field=name. price_vnd thiếu, không nguyên (kể cả 1500.5), hoặc không dương trả 400 field=price_vnd; sai kiểu JSON như chuỗi trả invalid_request không cần field. items thiếu hoặc rỗng trả field=items. Từng phần tử kiểm menu_item_id dương, quantity nguyên dương, rồi món không trùng phần tử trước; lỗi mang field=items[i].menu_item_id hoặc items[i].quantity. Sau quyền, đọc từng món theo thứ tự; không có trả 404 menu_item_not_found, ngừng bán trả 409 menu_item_discontinued, cùng field=items[i].menu_item_id. Chèn combo và mọi thành phần trong cùng giao dịch; trigger hoãn kiểm lúc COMMIT. Giá riêng do chủ quán đặt, không cộng giá món. Lập không bị khoá theo giờ bán. Người lập và mốc do database cấp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuCombo'
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCombo'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-combos/{menu_combo_id}/price:
    put:
      operationId: updateMenuComboPrice
      tags: [combo]
      summary: Đổi giá combo ngoài giờ bán, có lý do.
      description: Lớp chu_quan. Kiểm hình trước quyền và database; path id sai hoặc không dương trả 400 field=menu_combo_id. price_vnd thiếu, không nguyên (kể cả số lẻ), hoặc không dương trả 400 field=price_vnd; sai kiểu JSON như chuỗi trả invalid_request không cần field. Sau đó reason cắt khoảng trắng, thiếu hoặc rỗng trả 400 field=reason. Trong giao dịch, khoá combo; không có trả 404 menu_combo_not_found; đã ẩn trả 409 menu_combo_hidden. Lấy ngayban.DongHo rồi xét giờ bán bằng múi giờ phiên kết nối, hai đầu đều trong giờ; trong giờ trả 409 menu_combo_price_in_sales_hours. Đổi giá ngoài giờ có vết và lý do.
      parameters:
        - name: menu_combo_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuComboPrice'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCombo'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-combos/{menu_combo_id}/hiding:
    post:
      operationId: hideMenuCombo
      tags: [combo]
      summary: Ẩn combo có lý do.
      description: Lớp chu_quan. Kiểm hình trước quyền và database; path id sai hoặc không dương trả 400 field=menu_combo_id. reason cắt khoảng trắng, thiếu hoặc rỗng trả 400 field=reason. Khoá combo; không có trả 404 menu_combo_not_found, đã ẩn trả 409 menu_combo_hidden. Ghi hidden_at=now(), hidden_by_person_id=actor_person_id(), có vết và lý do. Không khoá theo giờ bán. Thành phần ở lại. Không có cửa đổi tên, thành phần hoặc số phần.
      parameters:
        - name: menu_combo_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HideMenuCombo'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCombo'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-categories:
    get:
      operationId: listMenuCategories
      tags: [danhmuc]
      summary: Đọc toàn bộ món gom theo danh mục.
      description: Lớp chu_quan. Mọi lỗi hình xét trước quyền và database, trừ lý do chuyển món cần đọc dòng xếp trước. Path id phải là số nguyên dương, sai trả invalid_request với field tương ứng. include_hidden vắng hoặc false thì bỏ danh mục ẩn, true thì kèm, giá trị khác trả 400 field=include_hidden. Danh mục theo name rồi id; món theo name rồi id, theo collation của cột. Mỗi món kể cả ngừng bán xuất hiện đúng một lần; món chưa xếp hoặc thuộc danh mục bị bỏ nằm trong uncategorized_items.
      parameters:
        - name: include_hidden
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryList'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createMenuCategory
      tags: [danhmuc]
      summary: Thêm danh mục món.
      description: Lớp chu_quan. Mọi lỗi hình xét trước quyền và database, trừ lý do chuyển món cần đọc dòng xếp trước. Path id phải là số nguyên dương, sai trả invalid_request với field tương ứng. name cắt khoảng trắng, thiếu hoặc rỗng trả 400 field=name. Trùng tên danh mục còn dùng trả 409 menu_category_name_taken; danh mục ẩn nhường tên. Người lập và mốc do database cấp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuCategory'
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategory'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-categories/{menu_category_id}:
    put:
      operationId: renameMenuCategory
      tags: [danhmuc]
      summary: Đổi tên danh mục có lý do.
      description: Lớp chu_quan. Mọi lỗi hình xét trước quyền và database, trừ lý do chuyển món cần đọc dòng xếp trước. Path id phải là số nguyên dương, sai trả invalid_request với field tương ứng. name và reason cắt khoảng trắng, thiếu hoặc rỗng trả 400 với field tương ứng. Không có trả 404 menu_category_not_found; đã ẩn trả 409 menu_category_hidden; trùng tên còn dùng trả 409 menu_category_name_taken. Sửa có vết.
      parameters:
        - name: menu_category_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuCategory'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategory'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-categories/{menu_category_id}/hiding:
    post:
      operationId: hideMenuCategory
      tags: [danhmuc]
      summary: Ẩn danh mục có lý do, kể cả khi còn món.
      description: Lớp chu_quan. Mọi lỗi hình xét trước quyền và database, trừ lý do chuyển món cần đọc dòng xếp trước. Path id phải là số nguyên dương, sai trả invalid_request với field tương ứng. reason cắt khoảng trắng, thiếu hoặc rỗng trả 400 field=reason. Không có trả 404 menu_category_not_found; đã ẩn trả 409 menu_category_hidden. Ẩn có vết, người và mốc; các dòng xếp món ở lại, đọc mặc định đưa món về uncategorized_items.
      parameters:
        - name: menu_category_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HideMenuCategory'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategory'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-items/{menu_item_id}/category:
    put:
      operationId: assignMenuItemCategory
      tags: [danhmuc]
      summary: Xếp hoặc chuyển món vào một danh mục.
      description: Lớp chu_quan. Mọi lỗi hình xét trước quyền và database, trừ lý do chuyển món cần đọc dòng xếp trước. Path id phải là số nguyên dương, sai trả invalid_request với field tương ứng. menu_category_id thiếu hoặc không dương trả 400 field=menu_category_id. Khoá món rồi danh mục đích; không có trả 404 menu_item_not_found hoặc menu_category_not_found, đích đã ẩn trả 409 menu_category_hidden. Chưa xếp thì thêm, không cần hay lưu reason. Đã ở đích trả 409 menu_item_already_in_category. Chuyển từ danh mục khác kể cả đã ẩn cần reason sau cắt khoảng trắng, thiếu hoặc rỗng trả 400 field=reason sau khi đọc dòng xếp; chuyển có vết. Không có đường bỏ xếp. Trả danh mục đích đọc lại sau ghi.
      parameters:
        - name: menu_item_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignMenuItemCategory'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategory'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assigned-tasks/{assigned_task_id}/guides:
    get:
      operationId: listAssignedTaskGuides
      tags: [daotao]
      summary: Đọc hướng dẫn theo thứ tự gắn.
      description: Lớp quay_hoac_chu_quan. Mọi lỗi hình được kiểm trước quyền và database; path id phải là số nguyên dương, sai trả invalid_request với field tương ứng. Thứ tự created_at, id tăng dần. Include_hidden vắng/false bỏ mẩu ẩn, true kèm, khác trả field=include_hidden. Việc không có trả assigned_task_not_found; việc đã ẩn vẫn đọc được.
      parameters:
        - name: assigned_task_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: include_hidden
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignedTaskGuides'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: attachAssignedTaskGuide
      tags: [daotao]
      summary: Gắn chữ, ảnh hoặc video vào việc.
      description: Lớp quay_hoac_chu_quan. Mọi lỗi hình được kiểm trước quyền và database; path id phải là số nguyên dương, sai trả invalid_request với field tương ứng. Kind thiếu/sai trả field=kind. Text cần body cắt khoảng trắng không rỗng (field=body), không phần file (field=file). Image/video không trường body (field=body), cần file không rỗng và đúng loại theo nội dung (field=file). Nhận JPEG, PNG, WebP tối đa 10 MiB; MP4, WebM, QuickTime tối đa 100 MiB, đúng bằng được nhận; quá cỡ trả file_too_large (413). Thân không multipart trả invalid_request. Khoá việc; không có trả assigned_task_not_found, đã ẩn trả assigned_task_hidden. Tệp ghi trước giao dịch, giao dịch lỗi xoá tệp vừa ghi; database chỉ giữ khoá.
      parameters:
        - name: assigned_task_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAssignedTaskGuide'
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignedTaskGuide'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assigned-task-guides/{assigned_task_guide_id}:
    put:
      operationId: updateAssignedTaskGuide
      tags: [daotao]
      summary: Sửa chữ của hướng dẫn, có lý do.
      description: Lớp quay_hoac_chu_quan. Mọi lỗi hình được kiểm trước quyền và database; path id phải là số nguyên dương, sai trả invalid_request với field tương ứng. Body cắt khoảng trắng, rỗng trả field=body; reason cắt khoảng trắng, thiếu/rỗng trả field=reason. Khoá mẩu; không có trả assigned_task_guide_not_found, đã ẩn trả assigned_task_guide_hidden, mẩu ảnh/video trả assigned_task_guide_not_text. Sửa có vết, không đổi tệp.
      parameters:
        - name: assigned_task_guide_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssignedTaskGuide'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignedTaskGuide'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assigned-task-guides/{assigned_task_guide_id}/hiding:
    post:
      operationId: hideAssignedTaskGuide
      tags: [daotao]
      summary: Ẩn hướng dẫn, giữ tệp.
