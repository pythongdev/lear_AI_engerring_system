      type: object
      required: [paper_position, sold_at, kind, items, cash_vnd, transfer_vnd]
      additionalProperties: true
      description: >-
        sold_at phải thuộc sale_date theo múi giờ quán và trước đồng hồ giao dịch.
        items cùng hình dòng gọi món, không dùng giá gửi lên. Bỏ trường lạ như các cửa hiện có.
        Không dùng trả trước; prepaid_cash_vnd và prepaid_transfer_vnd nếu gửi phải bằng 0.
        Không nhận submission_code của khách: định danh lần nhập là sổ và vị trí; backend cấp dấu nội bộ cho đơn.
        Nợ đơn mang đi bắt buộc debt_note; tại bàn theo cửa đóng phiên. Không nợ thì debt_note vắng hoặc null.
        Giảm giá chỉ chủ quán, kèm tên khách, không vượt tổng dòng.
      allOf:
        - if:
            properties:
              kind:
                const: table
          then:
            required: [dining_table_id]
        - if:
            properties:
              kind:
                const: takeaway
          then:
            required: [handover_code, customer_phone, customer_needed_at]
            properties:
              dining_table_id:
                type: 'null'
        - if:
            properties:
              kind:
                const: takeaway
              handover_code:
                const: door_delivery
            required: [handover_code]
          then:
            required: [delivery_address]
            properties:
              delivery_address:
                type: string
                pattern: '\S'
