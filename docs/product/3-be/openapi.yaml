components:
  securitySchemes:
    PersonIdentity:
      type: apiKey
      in: header
      name: X-Person-Id
      description: >-
        Chọn tên (chủ quán chốt 2026-10-09, U-075; ADR-085 Sửa đổi 2026-10-10).
        Giá trị gồm chỉ chữ số thập phân ASCII, biểu diễn số nguyên dương int64 của người đã chọn.
        authz.ChonTen đọc header; authz.RunAs kiểm người tồn tại và lớp quyền trong giao dịch.
        Không mật khẩu: máy tin tên được chọn. Áp dụng cho mọi cửa ghi cần người;
        đường đọc, tính thử giá và đường khách QR/web dùng security rỗng, giữ hành vi hiện có.
  schemas:
    Person:
      type: object
      additionalProperties: false
      required: [person_id, display_name, is_owner]
      properties:
        person_id:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type: string
        is_owner:
          type: boolean
    People:
      type: object
      additionalProperties: false
      required: [people]
      properties:
        people:
          type: array
          items:
            $ref: '#/components/schemas/Person'
    CurrentCounterDuty:
      type: object
      additionalProperties: false
      required: [person_id, display_name, counter_duty_id, started_at]
      properties:
        person_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
        display_name:
          type: [string, 'null']
        counter_duty_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
        started_at:
          anyOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
    EnteredCounterDuty:
      type: object
      additionalProperties: false
      required: [counter_duty_id, person_id, started_at, replaced_person_id]
      properties:
        counter_duty_id:
          type: integer
          format: int64
          minimum: 1
        person_id:
          type: integer
          format: int64
          minimum: 1
        started_at:
          $ref: '#/components/schemas/Instant'
        replaced_person_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
    EndedCounterDuty:
      type: object
      additionalProperties: false
      required: [counter_duty_id, person_id, started_at, ended_at]
      properties:
        counter_duty_id:
          type: integer
          format: int64
          minimum: 1
        person_id:
          type: integer
          format: int64
          minimum: 1
        started_at:
          $ref: '#/components/schemas/Instant'
        ended_at:
          $ref: '#/components/schemas/Instant'
    PreorderReminder:
      type: object
      additionalProperties: false
      required: [sales_order_id, customer_needed_at, status, remind_at, due_reminders]
      properties:
        sales_order_id:
          type: integer
          format: int64
        customer_needed_at:
          $ref: '#/components/schemas/Instant'
        status:
          type: string
          enum: [confirmed, in_progress]
        remind_at:
          description: Hai mốc theo thứ tự giờ cần hàng trừ 20 phút, trừ 10 phút.
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Instant'
        due_reminders:
          description: Các mốc đã tới theo don.DongHo, theo thứ tự 20 rồi 10 phút.
          type: array
          enum: [[], [20], [20, 10]]
          items:
            type: integer
            enum: [20, 10]
    StationJobSelection:
      type: 'object'
      required:
        - 'station_job_ids'
      properties:
        station_job_ids:
          type: 'array'
          items:
            type: 'integer'
            format: 'int64'
            minimum: 1
          minItems: 1
          uniqueItems: true
    ProductionBatchMade:
      type: 'object'
      required:
        - 'production_batch_id'
        - 'made_at'
        - 'station_job_ids'
      properties:
        production_batch_id:
          type: 'integer'
          format: 'int64'
          minimum: 1
        made_at:
          $ref: '#/components/schemas/Instant'
        station_job_ids:
          type: 'array'
          items:
            type: 'integer'
            format: 'int64'
            minimum: 1
    ProductionBatchRolledBack:
      type: 'object'
      required:
        - 'production_batch_id'
        - 'rolled_back_at'
        - 'station_job_ids'
      properties:
        production_batch_id:
          type: 'integer'
          format: 'int64'
          minimum: 1
        rolled_back_at:
          $ref: '#/components/schemas/Instant'
        station_job_ids:
          type: 'array'
          items:
            type: 'integer'
            format: 'int64'
            minimum: 1
    ServedMarkRequest:
      description: 'Số cái từng thứ cho MỘT bàn, hoặc một đơn không bàn — đúng một trong hai mã (S-5, 2026-10-09).'
      type: 'object'
      required:
        - 'items'
      properties:
        dining_table_id:
          type: 'integer'
          format: 'int64'
          minimum: 1
        sales_order_id:
          type: 'integer'
          format: 'int64'
          minimum: 1
        items:
          type: 'array'
          minItems: 1
          items:
            $ref: '#/components/schemas/ServedItem'
    ServedItem:
      description: 'Một hàng của bảng nhu cầu (khoá gom) và số cái vừa bưng.'
      type: 'object'
      required:
        - 'station_code'
        - 'menu_component_id'
        - 'filling_option_ids'
        - 'quantity'
      properties:
        station_code:
          type: 'string'
        menu_component_id:
          type:
            - 'integer'
            - 'null'
          format: 'int64'
        filling_option_ids:
          type: 'array'
          items:
            type: 'integer'
            format: 'int64'
          uniqueItems: true
        quantity:
          type: 'integer'
          format: 'int64'
          minimum: 1
    ServedMark:
      type: 'object'
      required:
        - 'station_job_ids'
        - 'completed_order_ids'
      properties:
        station_job_ids:
          type: 'array'
          items:
            type: 'integer'
            format: 'int64'
            minimum: 1
        completed_order_ids:
          type: 'array'
          items:
