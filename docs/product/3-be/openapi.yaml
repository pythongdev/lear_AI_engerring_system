# Hợp đồng API — Bánh cuốn Bà Thanh Cao Bằng. Owner: hàng *Hợp đồng API* ở CLAUDE.md §2.
# Khuôn, luật đọc và luật đổi file này: docs/product/3-be/01-hop-dong-api.md (P3-04, ADR-084).
# Hợp đồng thắng code; migration thắng hợp đồng về tên ràng buộc (ADR-053 luật 2).
# Gate 1g (scripts/check-api-contract.sh) đọc file này theo khuôn §2 của tài liệu trên:
# thụt hai dấu cách, mỗi khoá một dòng, không dùng neo hay khối gộp của YAML.
openapi: 3.1.0
info:
  title: Bánh cuốn Bà Thanh — API
  version: 0.12.0
  description: >-
    Nguồn duy nhất cho FE (pha 4 sinh type từ file này). Rỗng đường gọi ở P3-04;
    mỗi lát P3-05…P3-12 thêm đường gọi của mình cùng lượt dựng cửa.
# Mỗi lát thêm đường gọi của mình; khuôn bắt đầu rỗng (P3-04, Bẫy: không chép prompt-fullstack §3.6).
# Lớp quyền của mỗi cửa ghi: 02-vai-va-quyen.md (P3-05, ADR-085).
security:
  - PersonIdentity: []
paths:
  /people:
    get:
      operationId: listPeople
      security: []
      summary: Danh sách người để chọn tên, xếp theo display_name
      responses:
        '200':
          description: Danh sách người; mảng rỗng nếu chưa có người.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/People'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /counter-duty/current:
    get:
      operationId: getCurrentCounterDuty
      security: []
      summary: Người đang đứng quầy; không đòi danh tính người đọc
      responses:
        '200':
          description: Khoảng đang mở, hoặc cả bốn trường đều null khi quầy trống.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentCounterDuty'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /counter-duty:
    post:
      operationId: enterCounterDuty
      summary: Người đã chọn tên vào quầy — nguoi/vao_quay, lớp nguoi_quan
      description: >-
        Không nhận thân yêu cầu; người vào lấy từ X-Person-Id. Khoá khoảng đang mở trong giao dịch.
        Chính người đang đứng vào lại thì không ghi gì. Thay người khác thì khép khoảng cũ có vết
        và mở khoảng mới tại cùng now() của giao dịch. Nếu khoảng của người khác bắt đầu từ mốc
        giao dịch trở đi, hoặc chèn đụng khoảng trực khác, trả counter_duty_changed.
      responses:
        '200':
          description: Chính người đang đứng vào lại; trả khoảng cũ, replaced_person_id là null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnteredCounterDuty'
        '201':
          description: Đã mở khoảng mới; replaced_person_id là người ra, hoặc null nếu quầy trống.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnteredCounterDuty'
        '401':
          description: Chưa chọn tên, header không hợp lệ hoặc người không tồn tại (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Quầy vừa đổi người trong lúc bấm (counter_duty_changed); giao dịch lùi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /counter-duty/end:
    post:
      operationId: endCounterDuty
      summary: Người đang đứng quầy rời quầy — nguoi/roi_quay, lớp quay
      description: Không nhận thân yêu cầu; khép khoảng của người gọi tại now() của giao dịch, có vết.
      responses:
        '200':
          description: Khoảng trực đã khép; không mở khoảng thay thế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndedCounterDuty'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người gọi không đứng quầy (not_on_counter_duty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Mốc khép không sau mốc mở (counter_duty_changed); giao dịch lùi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # P3-05 — khách QR: mang MÃ, không mang bàn; bàn tra từ mã hiện hành (I-023). Không danh tính.
  /qr-codes/{code}:
    get:
      operationId: getTableByQrCode
      security: []
      summary: Bàn mà mã QR hiện hành chỉ tới
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mã đang hiện hành; nhãn của bàn nó chỉ tới.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrTable'
        '400':
          description: Yêu cầu gửi kèm một định danh bàn (invalid_request, field dining_table_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Mã đã bị thay hoặc không tồn tại — cùng một mã lỗi (qr_code_not_current).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # P3-05 — cửa qr/doi_ma, lớp chu_quan (U-062: chỉ chủ quán đổi mã).
  /dining-tables/{dining_table_id}/qr-code:
    post:
      operationId: issueQrCode
      summary: Cấp mã QR mới cho bàn; mã cũ hết hiện hành cùng mốc
      parameters:
        - name: dining_table_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '201':
          description: Mã mới đã cấp; người cấp là người thao tác của giao dịch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodeIssued'
        '400':
          description: dining_table_id không phải số nguyên dương (invalid_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người bấm không phải chủ quán (owner_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bàn không tồn tại (dining_table_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Một lần đổi mã khác cho cùng bàn chen vào (qr_code_issue_conflict); gửi lại nếu vẫn muốn đổi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu:
    get:
      operationId: getMenu
      security: []
      summary: Món đang bán và giá mọi tổ hợp hợp lệ
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /price-quotes:
    post:
      operationId: quotePrices
      security: []
      summary: Tính thử; bỏ qua mọi trường lạ kể cả giá gửi lên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceQuoteRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuote'
        '400':
          description: Yêu cầu sai hình (invalid_request); field chỉ trường sai nếu xác định được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Món hoặc lựa chọn không tồn tại (menu_item_not_found, menu_option_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Món đã ngừng bán tại mốc giao dịch (menu_item_discontinued).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Tổ hợp sai bị từ chối nguyên yêu cầu (option_combination_invalid); không sửa hộ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-components/{menu_component_id}/base-price:
    put:
      operationId: changeComponentPrice
      summary: Đổi giá gốc thành phần, có lý do
      parameters:
        - name: menu_component_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentPriceChange'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentPrice'
        '400':
          description: Yêu cầu sai hình (invalid_request); field chỉ trường sai nếu xác định được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người bấm không phải chủ quán (owner_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại (menu_component_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-options/{menu_option_id}/surcharge:
    put:
      operationId: changeOptionSurcharge
      summary: Đổi phụ thu, có lý do
      parameters:
        - name: menu_option_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptionSurchargeChange'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionSurcharge'
        '400':
          description: Yêu cầu sai hình (invalid_request); field chỉ trường sai nếu xác định được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người bấm không phải chủ quán (owner_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại (menu_option_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-items/{menu_item_id}/components/{menu_component_id}:
    put:
      operationId: changeItemComponent
      summary: Đổi số lượng thành phần suất, có lý do
      parameters:
        - name: menu_item_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: menu_component_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemComponentChange'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemComponent'
        '400':
          description: Yêu cầu sai hình (invalid_request); field chỉ trường sai nếu xác định được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người bấm không phải chủ quán (owner_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại (menu_item_not_found, menu_component_not_found, menu_item_component_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-items/{menu_item_id}/discontinuation:
    post:
      operationId: discontinueMenuItem
      summary: Ngừng bán món, giữ nguyên mốc khi ngừng lần nữa
      parameters:
        - name: menu_item_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuDiscontinuationRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuDiscontinuation'
        '400':
          description: Yêu cầu sai hình (invalid_request); field chỉ trường sai nếu xác định được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người bấm không phải chủ quán (owner_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại (menu_item_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Món đã ngừng bán (menu_item_discontinued); mốc cũ giữ nguyên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /online-orders:
    post:
      operationId: createOnlineOrder
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineOrderRequest'
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeawayOrder'
        '200':
          description: Thành công; gửi lại trả trạng thái hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeawayOrder'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /preorder-releases:
    post:
      operationId: releasePreorders
      description: Máy POS tự gọi bằng người đang đứng quầy; nhả đơn điện thoại tới mốc cần hàng trừ 20 phút trong một giao dịch. Không cần người bấm xuống bếp.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Các đơn được nhả lần này, theo giờ cần hàng rồi mã đơn; mảng rỗng khi không nhả đơn nào. Đơn đang bị khóa để lượt sau xử lý.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [released_order_ids]
                properties:
                  released_order_ids:
                    type: array
                    items:
                      type: integer
                      format: int64
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /preorder-reminders:
    get:
      operationId: getPreorderReminders
      security: []
      description: Chỉ đọc, không kiểm quyền như production-board; dùng don.DongHo, không ghi dữ liệu.
      responses:
        '200':
          description: Đơn điện thoại confirmed hoặc in_progress, theo giờ cần hàng rồi mã đơn; không gồm đơn đã xong hoặc hủy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [preorders]
                properties:
                  preorders:
                    type: array
                    items:
                      $ref: '#/components/schemas/PreorderReminder'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /phone-orders:
    post:
      operationId: createPhoneOrder
      description: Tạo ở confirmed; nếu giờ cần hàng trừ 20 phút đã tới theo don.DongHo thì nổ ngay và trả in_progress. Gửi lại dấu chỉ trả đơn cũ, không nổ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneOrderRequest'
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeawayOrder'
        '200':
          description: Thành công; gửi lại trả trạng thái hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeawayOrder'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{sales_order_id}/departure:
    post:
      operationId: departOrder
      parameters:
        - name: sales_order_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Đơn giao tận nơi đã rời quán; hai trường phiên là null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTransition'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /table-orders:
    post:
      operationId: createTableOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableOrderRequest'
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableOrder'
        '200':
          description: Thành công; gửi lại trả trạng thái hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableOrder'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /qr-codes/{code}/orders:
    post:
      operationId: createQrOrder
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrOrderRequest'
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
