components:
  securitySchemes:
    PersonIdentity:
      type: apiKey
      in: cookie
      name: banhcuon_phien
      description: Phiên đăng nhập theo ADR-109; HttpOnly, Secure, SameSite=Strict, hạn 7 ngày.
  schemas:
    MenuComboItem:
      type: object
      required: [menu_item_id, item_name, quantity, discontinued]
      properties:
        menu_item_id:
          type: integer
          format: int64
        item_name:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        discontinued:
          type: boolean
          description: discontinued_at IS NOT NULL; món ngừng bán vẫn có mặt khi đọc combo.
    MenuCombo:
      type: object
      required: [menu_combo_id, name, price_vnd, person_id, person_name, created_at, hidden_at, hidden_by_person_id, hidden_by_name, items]
      properties:
        menu_combo_id:
          type: integer
          format: int64
        name:
          type: string
        price_vnd:
          type: integer
          format: int64
          minimum: 1
        person_id:
          type: integer
          format: int64
        person_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Instant'
        hidden_at:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        hidden_by_person_id:
          type: [integer, 'null']
          format: int64
        hidden_by_name:
          type: [string, 'null']
        items:
          type: array
          description: Theo menu_combo_item.id, tức thứ tự gửi khi lập; không có trường giá trên từng món.
          items:
            $ref: '#/components/schemas/MenuComboItem'
    MenuComboList:
      type: object
      required: [combos]
      properties:
        combos:
          type: array
          description: Theo tên combo (collation của cột), rồi id; rỗng trả [].
          items:
            $ref: '#/components/schemas/MenuCombo'
    CreateMenuCombo:
      type: object
      required: [name, price_vnd, items]
      properties:
        name:
          type: string
          minLength: 1
        price_vnd:
          type: integer
          format: int64
          minimum: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateMenuComboItem'
    CreateMenuComboItem:
      type: object
      required: [menu_item_id, quantity]
      properties:
        menu_item_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
    UpdateMenuComboPrice:
      type: object
      required: [price_vnd, reason]
      properties:
        price_vnd:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
    HideMenuCombo:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
    MenuCategoryItem:
      type: object
      required: [menu_item_id, item_name, discontinued]
      properties:
        menu_item_id:
          type: integer
          format: int64
        item_name:
          type: string
        discontinued:
          type: boolean
          description: discontinued_at IS NOT NULL; món ngừng bán vẫn có mặt và xếp được.
    MenuCategory:
      type: object
      required: [menu_category_id, name, person_id, person_name, created_at, hidden_at, hidden_by_person_id, hidden_by_name, items]
      properties:
        menu_category_id:
          type: integer
          format: int64
        name:
          type: string
        person_id:
          type: integer
          format: int64
        person_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Instant'
        hidden_at:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        hidden_by_person_id:
          type: [integer, 'null']
          format: int64
        hidden_by_name:
          type: [string, 'null']
        items:
          type: array
          description: Theo tên món (collation của cột), rồi id; không có món trả mảng rỗng.
          items:
            $ref: '#/components/schemas/MenuCategoryItem'
    MenuCategoryList:
      type: object
      required: [categories, uncategorized_items]
      properties:
        categories:
          type: array
          description: Theo tên danh mục (collation của cột), rồi id.
          items:
            $ref: '#/components/schemas/MenuCategory'
        uncategorized_items:
          type: array
          description: Món chưa xếp hoặc danh mục của nó không có trong categories; theo tên món rồi id.
          items:
            $ref: '#/components/schemas/MenuCategoryItem'
    CreateMenuCategory:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    UpdateMenuCategory:
      type: object
      required: [name, reason]
      properties:
        name:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
    HideMenuCategory:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
    AssignMenuItemCategory:
      type: object
      required: [menu_category_id]
      properties:
        menu_category_id:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          description: Bắt buộc không rỗng sau cắt khoảng trắng khi chuyển danh mục; không lưu khi xếp lần đầu.
    AssignedTaskGuide:
      type: object
      description: Body là chuỗi với text, null với image/video. Khoá tệp không đưa ra dây; tải qua đường /file.
      required: [assigned_task_guide_id, assigned_task_id, kind, body, person_id, person_name, created_at, hidden_at, hidden_by_person_id, hidden_by_name]
      properties:
        assigned_task_guide_id:
          type: integer
          format: int64
          minimum: 1
        assigned_task_id:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [text, image, video]
        body:
          type: [string, 'null']
        person_id:
          type: integer
          format: int64
          minimum: 1
        person_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Instant'
        hidden_at:
          type: [string, 'null']
          format: date-time
        hidden_by_person_id:
          type: [integer, 'null']
          format: int64
        hidden_by_name:
          type: [string, 'null']
    TrainingRecord:
      type: object
      required: [training_record_id, trainee_person_id, trainee_name, remark, rating, person_id, person_name, created_at, hidden_at, hidden_by_person_id, hidden_by_name]
      properties:
        training_record_id:
          type: integer
          format: int64
          minimum: 1
        trainee_person_id:
          type: integer
          format: int64
          minimum: 1
        trainee_name:
          type: string
        remark:
          type: [string, 'null']
        rating:
          type: [string, 'null']
          enum: [pass, not_yet, null]
        person_id:
          type: integer
          format: int64
          minimum: 1
        person_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Instant'
        hidden_at:
          type: [string, 'null']
          format: date-time
        hidden_by_person_id:
          type: [integer, 'null']
          format: int64
        hidden_by_name:
          type: [string, 'null']
    AssignedTaskGuides:
      type: object
      required: [guides]
      properties:
        guides:
          type: array
          items:
            $ref: '#/components/schemas/AssignedTaskGuide'
    TrainingRecords:
      type: object
      required: [training_records]
      properties:
        training_records:
          type: array
          items:
            $ref: '#/components/schemas/TrainingRecord'
    CreateAssignedTaskGuide:
      type: object
      description: Text cần body và không file; image/video cần file và không body. Kiểm nội dung tệp, không tin tên hay Content-Type người gửi.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [text, image, video]
        body:
          type: string
          minLength: 1
        file:
          type: string
          format: binary
    UpdateAssignedTaskGuide:
      type: object
      required: [body, reason]
      properties:
        body:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
    HideTrainingItem:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
    CreateTrainingRecord:
      type: object
      description: Ít nhất remark hoặc rating khác null.
      required: [trainee_person_id]
      properties:
        trainee_person_id:
          type: integer
          format: int64
          minimum: 1
        remark:
          type: [string, 'null']
          minLength: 1
        rating:
          type: [string, 'null']
          enum: [pass, not_yet, null]
    UpdateTrainingRecord:
      type: object
      description: Thay cả hai trường; ít nhất remark hoặc rating khác null.
      required: [reason]
      properties:
        remark:
          type: [string, 'null']
          minLength: 1
        rating:
          type: [string, 'null']
          enum: [pass, not_yet, null]
        reason:
          type: string
          minLength: 1
    AssignedTaskMark:
      type: object
      required: [assigned_task_mark_id, mark, person_id, person_name, created_at]
      properties:
        assigned_task_mark_id:
          type: integer
          format: int64
        mark:
          type: string
          enum: [done, undone]
        person_id:
          type: integer
          format: int64
        person_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Instant'
    AssignedTask:
      type: object
      description: Tên người lấy từ person.display_name; person là người tạo. Ba trường hidden là null khi chưa ẩn.
      required: [assigned_task_id, content, assignee_person_id, assignee_name, person_id, person_name, created_at, done, marks, hidden_at, hidden_by_person_id, hidden_by_name]
      properties:
        assigned_task_id:
          type: integer
          format: int64
        content:
          type: string
        assignee_person_id:
          type: integer
          format: int64
        assignee_name:
          type: string
        person_id:
          type: integer
          format: int64
        person_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Instant'
        done:
          type: boolean
          description: Sự kiện mới nhất theo created_at DESC, id DESC là done; không sự kiện thì false.
        marks:
          type: array
          description: Thứ tự created_at, id tăng dần; chưa có trả mảng rỗng.
          items:
            $ref: '#/components/schemas/AssignedTaskMark'
        hidden_at:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        hidden_by_person_id:
          type: [integer, 'null']
          format: int64
        hidden_by_name:
          type: [string, 'null']
    AssignedTasks:
      type: object
      required: [assigned_tasks]
      properties:
        assigned_tasks:
          type: array
          items:
            $ref: '#/components/schemas/AssignedTask'
