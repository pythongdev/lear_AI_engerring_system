# Hợp đồng API — Bánh cuốn Bà Thanh Cao Bằng. Owner: hàng *Hợp đồng API* ở CLAUDE.md §2.
# Khuôn, luật đọc và luật đổi file này: docs/product/3-be/01-hop-dong-api.md (P3-04, ADR-084).
# Hợp đồng thắng code; migration thắng hợp đồng về tên ràng buộc (ADR-053 luật 2).
# Gate 1g (scripts/check-api-contract.sh) đọc file này theo khuôn §2 của tài liệu trên:
# thụt hai dấu cách, mỗi khoá một dòng, không dùng neo hay khối gộp của YAML.
openapi: 3.1.0
info:
  title: Bánh cuốn Bà Thanh — API
  version: 0.3.0
  description: >-
    Nguồn duy nhất cho FE (pha 4 sinh type từ file này). Rỗng đường gọi ở P3-04;
    mỗi lát P3-05…P3-12 thêm đường gọi của mình cùng lượt dựng cửa.
# Mỗi lát thêm đường gọi của mình; khuôn bắt đầu rỗng (P3-04, Bẫy: không chép prompt-fullstack §3.6).
# Lớp quyền của mỗi cửa ghi: 02-vai-va-quyen.md (P3-05, ADR-085).
paths:
  # P3-05 — khách QR: mang MÃ, không mang bàn; bàn tra từ mã hiện hành (I-023). Không danh tính.
  /qr-codes/{code}:
    get:
      operationId: getTableByQrCode
      summary: Bàn mà mã QR hiện hành chỉ tới
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mã đang hiện hành; nhãn của bàn nó chỉ tới.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrTable'
        '400':
          description: Yêu cầu gửi kèm một định danh bàn (invalid_request, field dining_table_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Mã đã bị thay hoặc không tồn tại — cùng một mã lỗi (qr_code_not_current).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # P3-05 — cửa qr/doi_ma, lớp chu_quan (U-062: chỉ chủ quán đổi mã).
  /dining-tables/{dining_table_id}/qr-code:
    post:
      operationId: issueQrCode
      summary: Cấp mã QR mới cho bàn; mã cũ hết hiện hành cùng mốc
      parameters:
        - name: dining_table_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '201':
          description: Mã mới đã cấp; người cấp là người thao tác của giao dịch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodeIssued'
        '400':
          description: dining_table_id không phải số nguyên dương (invalid_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người bấm không phải chủ quán (owner_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bàn không tồn tại (dining_table_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Một lần đổi mã khác cho cùng bàn chen vào (qr_code_issue_conflict); gửi lại nếu vẫn muốn đổi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu:
    get:
      operationId: getMenu
      summary: Món đang bán và giá mọi tổ hợp hợp lệ
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /price-quotes:
    post:
      operationId: quotePrices
      summary: Tính thử; bỏ qua mọi trường lạ kể cả giá gửi lên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceQuoteRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuote'
        '400':
          description: Yêu cầu sai hình (invalid_request); field chỉ trường sai nếu xác định được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Món hoặc lựa chọn không tồn tại (menu_item_not_found, menu_option_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Món đã ngừng bán tại mốc giao dịch (menu_item_discontinued).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Tổ hợp sai bị từ chối nguyên yêu cầu (option_combination_invalid); không sửa hộ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-components/{menu_component_id}/base-price:
    put:
      operationId: changeComponentPrice
      summary: Đổi giá gốc thành phần, có lý do
      parameters:
        - name: menu_component_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentPriceChange'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentPrice'
        '400':
          description: Yêu cầu sai hình (invalid_request); field chỉ trường sai nếu xác định được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người bấm không phải chủ quán (owner_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại (menu_component_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-options/{menu_option_id}/surcharge:
    put:
      operationId: changeOptionSurcharge
      summary: Đổi phụ thu, có lý do
      parameters:
        - name: menu_option_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptionSurchargeChange'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionSurcharge'
        '400':
          description: Yêu cầu sai hình (invalid_request); field chỉ trường sai nếu xác định được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người bấm không phải chủ quán (owner_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại (menu_option_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-items/{menu_item_id}/components/{menu_component_id}:
    put:
      operationId: changeItemComponent
      summary: Đổi số lượng thành phần suất, có lý do
      parameters:
        - name: menu_item_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: menu_component_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemComponentChange'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemComponent'
        '400':
          description: Yêu cầu sai hình (invalid_request); field chỉ trường sai nếu xác định được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người bấm không phải chủ quán (owner_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại (menu_item_not_found, menu_component_not_found, menu_item_component_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /menu-items/{menu_item_id}/discontinuation:
    post:
      operationId: discontinueMenuItem
      summary: Ngừng bán món, giữ nguyên mốc khi ngừng lần nữa
      parameters:
        - name: menu_item_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuDiscontinuationRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuDiscontinuation'
        '400':
          description: Yêu cầu sai hình (invalid_request); field chỉ trường sai nếu xác định được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Không xác định được người bấm (unauthenticated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người bấm không phải chủ quán (owner_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại (menu_item_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Món đã ngừng bán (menu_item_discontinued); mốc cũ giữ nguyên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống (internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ErrorCode:
      type: string
      description: >-
        Mã lỗi công khai. FE quyết hiện gì theo mã, không theo status, không theo chữ.
        Mã của một luật do lát dựng cửa của luật ấy thêm (01-hop-dong-api.md §3).
      enum:
        - internal_error
        - invalid_request
        - unauthenticated
        - not_on_counter_duty
        - owner_only
        - qr_code_not_current
        - dining_table_not_found
        - qr_code_issue_conflict
        - menu_item_not_found
        - menu_option_not_found
        - menu_component_not_found
        - menu_item_component_not_found
        - menu_item_discontinued
        - option_combination_invalid
      x-http-status:
        internal_error: 500
        invalid_request: 400
        unauthenticated: 401
        not_on_counter_duty: 403
        owner_only: 403
        qr_code_not_current: 404
        dining_table_not_found: 404
        qr_code_issue_conflict: 409
        menu_item_not_found: 404
        menu_option_not_found: 404
        menu_component_not_found: 404
        menu_item_component_not_found: 404
        menu_item_discontinued: 409
        option_combination_invalid: 422
    Error:
      type: object
      description: Hình lỗi chung của mọi lời từ chối (01-hop-dong-api.md §3).
      required: [code]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        field:
          type: string
          description: Tên trường của yêu cầu gây lỗi, khi lỗi chỉ được về một trường.
    MoneyVnd:
      type: integer
      format: int64
      minimum: 0
      description: Số tiền, số nguyên đồng, không âm (QD-20 · QD-21); không chuỗi, không phần lẻ.
    Instant:
      type: string
      format: date-time
      description: Một thời điểm RFC 3339 có độ lệch múi giờ (QD-30); mốc tính tiền do backend cấp.
    SaleDate:
      type: string
      format: date
      description: Ngày bán YYYY-MM-DD, quy bằng múi giờ của quán, do backend tính (QD-31).
    SubmissionCode:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Dấu lần gửi (I-024), phía gửi đặt một lần lúc bấm gửi, giữ nguyên khi gửi lại.
    QrTable:
      type: object
      description: Bàn mà một mã QR hiện hành chỉ tới — chỉ nhãn, không định danh bàn (I-023).
      required: [label]
      additionalProperties: false
      properties:
        label:
          type: string
    QrCodeIssued:
      type: object
      description: Mã vừa cấp cho một bàn.
      required: [code, dining_table_id, issued_at]
      additionalProperties: false
      properties:
        code:
          type: string
        dining_table_id:
          type: integer
          format: int64
        issued_at:
          $ref: '#/components/schemas/Instant'
    PriceLineRequest:
      type: object
      description: Không nhận giá; trường lạ bị bỏ qua. Nhóm có mặt phải được chọn đúng một lựa chọn.
      required: [menu_item_id, quantity, option_ids]
      additionalProperties: true
      properties:
        menu_item_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1
        option_ids:
          type: array
          items:
            type: integer
            format: int64
    PriceQuoteRequest:
      type: object
      description: Lỗi đầu tiên thắng, theo thứ tự dòng gửi; field có dạng lines[i].tên_trường.
      required: [lines]
      additionalProperties: true
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PriceLineRequest'
          minItems: 1
    PriceComponent:
      type: object
      required: [menu_component_id, component_name, quantity, takes_filling, base_price_vnd]
      additionalProperties: false
      properties:
        menu_component_id:
          type: integer
          format: int64
        component_name:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        takes_filling:
          type: boolean
        base_price_vnd:
          $ref: '#/components/schemas/MoneyVnd'
    PriceOption:
      type: object
      required: [menu_option_id, option_group_name, option_name, surcharge_vnd]
      additionalProperties: false
      properties:
        menu_option_id:
          type: integer
          format: int64
        option_group_name:
          type: string
        option_name:
          type: string
        surcharge_vnd:
          $ref: '#/components/schemas/MoneyVnd'
    PriceLine:
      type: object
      required: [menu_item_id, item_name, quantity, unit_price_vnd, line_total_vnd, components, options]
      additionalProperties: false
      properties:
        menu_item_id:
          type: integer
          format: int64
        item_name:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        unit_price_vnd:
          $ref: '#/components/schemas/MoneyVnd'
        line_total_vnd:
          $ref: '#/components/schemas/MoneyVnd'
        components:
          type: array
          items:
            $ref: '#/components/schemas/PriceComponent'
        options:
          type: array
          items:
            $ref: '#/components/schemas/PriceOption'
    PriceQuote:
      type: object
      required: [lines, total_vnd]
      additionalProperties: false
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PriceLine'
        total_vnd:
          $ref: '#/components/schemas/MoneyVnd'
    MenuOption:
      type: object
      required: [menu_option_id, option_name]
      additionalProperties: false
      properties:
        menu_option_id:
          type: integer
          format: int64
        option_name:
          type: string
    MenuOptionGroup:
      type: object
      required: [option_group_id, option_group_name, prerequisite_option_ids, options]
      additionalProperties: false
      properties:
        option_group_id:
          type: integer
          format: int64
        option_group_name:
          type: string
        prerequisite_option_ids:
          type: array
          items:
            type: integer
            format: int64
        options:
          type: array
          items:
            $ref: '#/components/schemas/MenuOption'
    MenuPrice:
      type: object
      required: [option_ids, unit_price_vnd]
      additionalProperties: false
      properties:
        option_ids:
          type: array
          items:
            type: integer
            format: int64
          description: Mã lựa chọn xếp tăng; rỗng nếu món không mang nhóm nào.
        unit_price_vnd:
          $ref: '#/components/schemas/MoneyVnd'
    MenuItem:
      type: object
      required: [menu_item_id, item_name, option_groups, prices]
      additionalProperties: false
      properties:
        menu_item_id:
          type: integer
          format: int64
        item_name:
          type: string
        option_groups:
          type: array
          items:
            $ref: '#/components/schemas/MenuOptionGroup'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/MenuPrice'
    Menu:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
    ComponentPriceChange:
      type: object
      required: [base_price_vnd, reason]
      additionalProperties: true
      properties:
        base_price_vnd:
          $ref: '#/components/schemas/MoneyVnd'
        reason:
          type: string
          minLength: 1
          description: Sau khi bỏ khoảng trắng đầu cuối phải còn nội dung.
    ComponentPrice:
      type: object
      required: [menu_component_id, base_price_vnd]
      additionalProperties: false
      properties:
        menu_component_id:
          type: integer
          format: int64
        base_price_vnd:
          $ref: '#/components/schemas/MoneyVnd'
    OptionSurchargeChange:
      type: object
      required: [surcharge_vnd, reason]
      additionalProperties: true
      properties:
        surcharge_vnd:
          $ref: '#/components/schemas/MoneyVnd'
        reason:
          type: string
          minLength: 1
          description: Sau khi bỏ khoảng trắng đầu cuối phải còn nội dung.
    OptionSurcharge:
      type: object
      required: [menu_option_id, surcharge_vnd]
      additionalProperties: false
      properties:
        menu_option_id:
          type: integer
          format: int64
        surcharge_vnd:
          $ref: '#/components/schemas/MoneyVnd'
    ItemComponentChange:
      type: object
      required: [quantity, reason]
      additionalProperties: true
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
        reason:
          type: string
          minLength: 1
          description: Sau khi bỏ khoảng trắng đầu cuối phải còn nội dung.
    ItemComponent:
      type: object
      required: [menu_item_id, menu_component_id, quantity]
      additionalProperties: false
      properties:
        menu_item_id:
          type: integer
          format: int64
        menu_component_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1
    MenuDiscontinuationRequest:
      type: object
      required: [reason]
      additionalProperties: true
      properties:
        reason:
          type: string
          minLength: 1
          description: Sau khi bỏ khoảng trắng đầu cuối phải còn nội dung.
    MenuDiscontinuation:
      type: object
      required: [menu_item_id, discontinued_at]
      additionalProperties: false
      properties:
        menu_item_id:
          type: integer
          format: int64
        discontinued_at:
          $ref: '#/components/schemas/Instant'
# Tên từ chối → mã (ADR-082 điểm 5). Mọi tên ở db/migrations/ một dòng: một mã của ErrorCode,
# internal (không bao giờ là luật người dùng chạm tới) hoặc unreviewed (chưa lát nào xét — chạy như
