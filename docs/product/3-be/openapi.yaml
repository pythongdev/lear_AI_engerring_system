    OnlineOrderRequest:
      type: object
      description: >-
        Kiểm submission_code, trường cấm, kênh/cách trao, liên hệ rồi lines.
        Chuỗi bắt buộc phải còn nội dung sau khi bỏ khoảng trắng; giữ nguyên từng byte khi ghi.
        Cấm dining_table_id và table_session_id kể cả null; bỏ trường lạ khác, kể cả giá.
      not:
        anyOf:
          - required: [dining_table_id]
          - required: [table_session_id]
      required: [submission_code, channel_code, customer_phone, lines]
      additionalProperties: true
      allOf:
        - if:
            properties:
              channel_code:
                const: delivery
          then:
            required: [delivery_address]
            properties:
              delivery_address:
                type: string
                minLength: 1
        - if:
            properties:
              channel_code:
                const: pickup
          then:
            required: [customer_needed_at]
            properties:
              customer_needed_at:
                $ref: '#/components/schemas/Instant'
      properties:
        submission_code:
          $ref: '#/components/schemas/SubmissionCode'
        channel_code:
          type: string
          enum: [delivery, pickup]
        customer_phone:
          type: string
          minLength: 1
        delivery_address:
          type: [string, 'null']
        customer_needed_at:
          type: [string, 'null']
          format: date-time
          description: RFC 3339 có độ lệch; bắt buộc khi pickup.
        customer_name:
          type: [string, 'null']
        contact_note:
          type: [string, 'null']
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PriceLineRequest'
    PhoneOrderRequest:
      type: object
      description: >-
        Kiểm submission_code, trường cấm, kênh/cách trao, liên hệ rồi lines.
        Chuỗi bắt buộc phải còn nội dung sau khi bỏ khoảng trắng; giữ nguyên từng byte khi ghi.
        Cấm dining_table_id và table_session_id kể cả null; bỏ trường lạ khác, kể cả giá.
      not:
        anyOf:
          - required: [dining_table_id]
          - required: [table_session_id]
      required: [submission_code, handover_code, customer_phone, customer_needed_at, lines]
      additionalProperties: true
      allOf:
        - if:
            properties:
              handover_code:
                const: door_delivery
          then:
            required: [delivery_address]
            properties:
              delivery_address:
                type: string
                minLength: 1
      properties:
        submission_code:
          $ref: '#/components/schemas/SubmissionCode'
        handover_code:
          type: string
          enum: [door_delivery, shop_pickup]
        customer_phone:
          type: string
          minLength: 1
        delivery_address:
          type: [string, 'null']
        customer_needed_at:
          $ref: '#/components/schemas/Instant'
        customer_name:
          type: [string, 'null']
        contact_note:
          type: [string, 'null']
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PriceLineRequest'
    TakeawayOrder:
      type: object
      required: [sales_order_id, channel_code, handover_code, status, total_vnd, lines, customer_phone, delivery_address, customer_needed_at, customer_name, contact_note]
