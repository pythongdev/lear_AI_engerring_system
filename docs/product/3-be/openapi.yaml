    Error:
      type: object
      description: Hình lỗi chung của mọi lời từ chối (01-hop-dong-api.md §3).
      required: [code]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        field:
          type: string
          description: Tên trường của yêu cầu gây lỗi, khi lỗi chỉ được về một trường.
    MoneyVnd:
      type: integer
      format: int64
      minimum: 0
      description: Số tiền, số nguyên đồng, không âm (QD-20 · QD-21); không chuỗi, không phần lẻ.
    Instant:
      type: string
      format: date-time
      description: Một thời điểm RFC 3339 có độ lệch múi giờ (QD-30); mốc tính tiền do backend cấp.
    SaleDate:
      type: string
      format: date
      description: Ngày bán YYYY-MM-DD, quy bằng múi giờ của quán, do backend tính (QD-31).
    SubmissionCode:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Dấu lần gửi (I-024), phía gửi đặt một lần lúc bấm gửi, giữ nguyên khi gửi lại.
    QrTable:
      type: object
      description: Bàn mà một mã QR hiện hành chỉ tới — chỉ nhãn, không định danh bàn (I-023).
      required: [label]
      additionalProperties: false
      properties:
        label:
          type: string
    QrCodeIssued:
      type: object
      description: Mã vừa cấp cho một bàn.
      required: [code, dining_table_id, issued_at]
      additionalProperties: false
      properties:
        code:
          type: string
        dining_table_id:
          type: integer
          format: int64
        issued_at:
          $ref: '#/components/schemas/Instant'
    PriceLineRequest:
      type: object
      description: Không nhận giá; trường lạ bị bỏ qua. Nhóm có mặt phải được chọn đúng một lựa chọn.
      required: [menu_item_id, quantity, option_ids]
      additionalProperties: true
      properties:
        menu_item_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1
        option_ids:
          type: array
          items:
            type: integer
            format: int64
    PriceQuoteRequest:
      type: object
      description: Lỗi đầu tiên thắng, theo thứ tự dòng gửi; field có dạng lines[i].tên_trường.
      required: [lines]
      additionalProperties: true
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PriceLineRequest'
          minItems: 1
    PriceComponent:
      type: object
      required: [menu_component_id, component_name, quantity, takes_filling, base_price_vnd]
      additionalProperties: false
      properties:
        menu_component_id:
          type: integer
          format: int64
        component_name:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        takes_filling:
          type: boolean
        base_price_vnd:
          $ref: '#/components/schemas/MoneyVnd'
    PriceOption:
      type: object
      required: [menu_option_id, option_group_name, option_name, surcharge_vnd]
      additionalProperties: false
      properties:
        menu_option_id:
          type: integer
          format: int64
        option_group_name:
          type: string
        option_name:
          type: string
        surcharge_vnd:
          $ref: '#/components/schemas/MoneyVnd'
    PriceLine:
      type: object
      required: [menu_item_id, item_name, quantity, unit_price_vnd, line_total_vnd, components, options]
      additionalProperties: false
      properties:
        menu_item_id:
          type: integer
          format: int64
        item_name:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        unit_price_vnd:
