          application/json:
            schema:
              $ref: '#/components/schemas/WriteExpense'
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listExpenses
      tags: [khoanchi]
      summary: Chủ quán đọc khoản chi theo khoảng ngày, loại và nguồn.
      description: from và to bắt buộc, đúng YYYY-MM-DD và from ≤ to; sai trả invalid_request ở tham số sai. Sắp theo paid_date rồi expense_id; backend cộng total_vnd từ các khoản trả về.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SaleDate'
        - name: to
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SaleDate'
        - name: expense_category_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: paid_from_till
          in: query
          description: Chỉ nhận true hoặc false.
          schema:
            type: boolean
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expenses'
        default:
          description: Lời từ chối theo ErrorCode và x-http-status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
